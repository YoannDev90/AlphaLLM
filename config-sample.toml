# ===== Configuration générale =====
[config]
# Mode debug (true pour développement, false pour production)
debug = true
# IDs des développeurs (liste d'IDs Discord)
dev_id = [123456789012345678, 123456789012345678]
# ID du serveur administrateur
admin_server = 123456789012345678
# Lien du serveur de support Discord
support_server = "https://discord.com/invite/your_invite_link"

# ===== Configuration du lanceur =====
[launcher]
# Activer/désactiver les différents composants
run_api = true
run_main_bot = true
run_secondary_bots = false
run_admin_bot = true
run_logger_bot = true

# ===== Configuration de l'API =====
[api]
# Adresse d'écoute de l'API
host = "0.0.0.0"
# Port d'écoute
port = 25692
# Certificats SSL (laisser vide pour HTTP)
ssl_certfile = "certfile.pem"
ssl_keyfile = "keyfile.pem"
# URL publique de l'API
api_url = "https://your-api-domain.com"
# Timeout des requêtes en secondes
request_timeout = 300
# Clé API requise pour accéder à l'API
api_key_required = false
# Hôtes autorisés (liste d'origines)
allowed_hosts = ["*"]
# Origines CORS autorisées
cors_origins = ["*"]

# ===== Configuration des logs =====
[logs]
# Niveau de logging (DEBUG, INFO, WARNING, ERROR, CRITICAL)
logging_level = "INFO"
# Nom du logger
logger_name = "AlphaLLM"
# ID du canal de logs Discord
channel_id = 123456789012345678
# ID du rôle de log
log_role_id = 123456789012345678
# Nom du canal de logs
channel_name = "📄-logs"
# ID de la catégorie des logs
category_id = 123456789012345678
# URL Loki pour Grafana
loki_url = "https://logs-prod-012.grafana.net/loki/api/v1/push"
# ID utilisateur Grafana
user_id = 123456

# ===== Configuration de la mémoire =====
[memory]
# Nom de la base de données ChromaDB
chroma_db_name = "AlphaLLM"
# Modèle d'embeddings pour la vectorisation
embedder_model = "sentence-transformers/all-MiniLM-L6-v2"
# Répertoire de cache pour les embeddings
embedder_cache_dir = "./data/embedder"
# Modèle pour le function calling
function_calling_model = "google/functiongemma-270m-it"
# Répertoire de cache pour le function calling
function_calling_cache_dir = "./data/function_calling"
# Collection pour les documents RAG
chroma_rag_collection = "rag_documents"
# Collection pour la mémoire à court terme
chroma_stm_collection = "stm_memories"
# Collection pour la mémoire à long terme
chroma_ltm_collection = "ltm_memories"
# Âge maximum de la mémoire à court terme (en secondes, 4h = 14400s)
stm_max_age = 14400
# Similarité minimale pour la mémoire à long terme (0.0 à 1.0)
ltm_min_similarity = 0.3

# ===== Configuration des modèles =====
[models]
# Liste des modèles disponibles (doit correspondre aux fichiers dans configs/text-models/)
